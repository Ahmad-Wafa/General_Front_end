<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="assets/style.css">
  <title>Frontend Mentor | Product preview card component</title>
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <div class="left-side">
      
      <img src="assets/images/image-product-desktop.jpg" alt="" class="desktop-img">
      <img src="assets/images/image-product-mobile.jpg" alt="" class="mobile-img">
    </div>
    <div class="right_side">
      <h3>PERFUME</h3>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
      
      <div class="price">

        <span class="new_price">$149.99</span>

        <span class="old_price">$169.99</span>

      </div>
  
      <a href="#">
        
        <img src="assets/images/icon-cart.svg" alt="">
        
        Add to Cart

      </a>

    </div>

  </main>

  <div class="attribution">

    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 

    Coded by <a href="#">Ahmad Wafa</a>.

  </div> 
</body>
</html>
